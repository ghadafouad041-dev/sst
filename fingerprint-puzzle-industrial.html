<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لغز البصمات — الثورة الصناعية</title>

<!--
╔══════════════════════════════════════════════════════════════════╗
║  لغز البصمات — لعبة تعليمية تفاعلية (ملف HTML واحد، تعمل بلا إنترنت)  ║
╠══════════════════════════════════════════════════════════════════╣
║  دليل التعديل السريع (ابحث عن هذه العناوين داخل الملف):            ║
║                                                                  ║
║  1) الصورة ............ ابحث عن:  [1] IMAGE                       ║
║        - الصورة مضمَّنة داخل الملف نفسه (وسم <img id="boardImg">).  ║
║        - لتغييرها: ضع اسم ملف صورة بجانب هذا الملف، واكتب اسمه في   ║
║          IMAGE.src (مثال: "case.png"). وإن اختلفت أبعادها، عدّل      ║
║          IMAGE.width و IMAGE.height (فضاء الإحداثيات).              ║
║  2) الإعدادات والنقاط .. ابحث عن:  [2] SETTINGS                    ║
║  3) أسماء المجموعات ... ابحث عن:  [3] GROUPS  → الحقل name         ║
║        (ويمكن أيضًا تعديل الاسم مباشرة من لوحة النقاط بالنقر عليه)  ║
║  4) بنك الأسئلة ........ ابحث عن:  [3] GROUPS → questions          ║
║  5) أماكن الـ Hotspots .. في كل سؤال: hotspot:{x,y,w,h}            ║
║        (بالبكسل بالنسبة لأبعاد الصورة IMAGE.width × IMAGE.height)   ║
║        اضغط حرف D من لوحة المفاتيح لإظهار كل المناطق ومعايرتها.     ║
║  6) المفاجآت ........... في كل مجموعة: surprises  + [4] SURPRISES   ║
║  7) السؤال النهائي ..... ابحث عن:  [5] FINAL                       ║
╚══════════════════════════════════════════════════════════════════╝
-->

<style>
/* ===================================================================
   التنسيق العام — خلفية بيضاء + ألوان زاهية بأسلوب "ملف قضية" تعليمي
   =================================================================== */
:root{
  --ink:#1F2A44; --muted:#5B6785; --line:#E8ECF5; --paper:#FFF8E1;
  --yellow:#FFD23F; --yellow-soft:#FFF3C4;
  --blue:#3AA0F0;   --blue-soft:#E3F2FF;
  --orange:#FF9A3C; --orange-soft:#FFEBD6;
  --green:#4CC27A;  --green-soft:#E2F8EA;
  --pink:#FF7FAF;   --pink-soft:#FFE6F0;
  --headH:66px;
  --font:"Cairo","Tajawal","Segoe UI","Noto Naskh Arabic","Noto Sans Arabic",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#fff;color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent}
body{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}

/* ---------- الشريط العلوي ---------- */
.top{height:var(--headH);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;background:#fff;border-bottom:4px solid var(--yellow);position:relative;z-index:5}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:4px;background:linear-gradient(90deg,var(--blue),var(--green),var(--yellow),var(--orange),var(--pink))}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{font-size:34px;line-height:1}
.brand h1{font-size:clamp(18px,2.1vw,28px);font-weight:900;white-space:nowrap}
.brand h1 b{color:var(--orange)}
.brand .sub{background:var(--yellow-soft);border:2px dashed #F2C200;border-radius:12px;padding:3px 12px;font-weight:700;font-size:clamp(12px,1.2vw,16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:8px;flex-wrap:nowrap}
.btn{border:0;border-radius:14px;padding:9px 16px;font-weight:800;background:var(--yellow);color:var(--ink);box-shadow:0 4px 0 rgba(31,42,68,.14);transition:transform .08s,box-shadow .08s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(31,42,68,.14)}
.btn.blue{background:var(--blue);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.pink{background:var(--pink);color:#fff}
.btn.orange{background:var(--orange);color:#fff}
.btn.ghost{background:#fff;border:2px solid var(--line);box-shadow:none;color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:.9em}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn .lbl{margin-inline-start:6px}

/* ---------- التخطيط الرئيسي ---------- */
.main{display:grid;grid-template-columns:minmax(250px,420px) auto minmax(250px,420px);justify-content:center;gap:16px;padding:16px 14px 8px;height:calc(100vh - var(--headH))}
.panel{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto;padding:2px 4px 10px}
.panel h3{font-size:1.05rem;font-weight:900;display:flex;align-items:center;gap:8px}
.card{background:#fff;border:3px solid var(--line);border-radius:20px;padding:12px 14px;box-shadow:0 6px 0 rgba(31,42,68,.05)}

/* ---------- لوحة النقاط ---------- */
.gcard{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;background:#fff;border:3px solid var(--gc);border-radius:18px;padding:8px 12px;box-shadow:0 5px 0 color-mix(in srgb,var(--gc) 35%,transparent);transition:transform .15s}
.gcard:hover{transform:translateY(-2px)}
.gcard .num{width:40px;height:40px;border-radius:50%;background:var(--gc);color:var(--gi);display:grid;place-items:center;font-weight:900;font-size:1.2rem}
.gcard .mid{min-width:0}
.gname{width:100%;border:0;background:transparent;font-weight:900;font-size:1.05rem;border-bottom:2px dashed transparent;outline:none;padding:0 2px;text-overflow:ellipsis}
.gname:hover,.gname:focus{border-bottom-color:var(--gc)}
.gtopic{font-size:.78rem;color:var(--muted);font-weight:700;padding:0 2px}
.gdots{display:flex;gap:5px;margin-top:5px}
.gdots i{width:100%;max-width:26px;height:9px;border-radius:6px;background:var(--line)}
.gdots i.on{background:var(--gc)}
.gscore{font-weight:900;font-size:1.9rem;min-width:56px;text-align:center;line-height:1;color:var(--ink)}
.gscore small{display:block;font-size:.7rem;font-weight:700;color:var(--muted)}
.gscore.pop{animation:pop .45s}
.gbadges{position:absolute;top:-11px;inset-inline-start:14px;display:flex;gap:5px}
.gbadges span{background:var(--ink);color:#fff;border-radius:10px;font-size:.72rem;font-weight:800;padding:1px 8px}
.gbadges .b-dbl{background:var(--orange)} .gbadges .b-hint{background:var(--blue)} .gbadges .b-frz{background:#47B8E8} .gbadges .b-done{background:var(--green)} .gbadges .b-crown{background:var(--yellow);color:var(--ink)}
.float{position:absolute;inset-inline-end:70px;top:6px;font-weight:900;font-size:1.5rem;pointer-events:none;animation:floatUp 1.2s forwards}
.float.up{color:#1C9B4B} .float.down{color:#E0245E}

/* ---------- لوحة الحالة ---------- */
.stat{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;margin-bottom:8px}
.stat .k{font-weight:800}
.stat .v{font-weight:900;font-size:1.3rem;direction:ltr;unicode-bidi:isolate}
.bar{grid-column:1/-1;height:12px;background:var(--line);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:8px;transition:width .5s}
.chipcase{display:inline-block;padding:4px 14px;border-radius:999px;font-weight:900}
.chipcase.locked{background:var(--pink-soft);color:#C2185B}
.chipcase.open{background:var(--green-soft);color:#12803C;animation:pulseSoft 1.4s infinite}
.chipcase.solved{background:var(--yellow-soft);color:#8A6A00}
.ev{list-style:none;display:flex;flex-direction:column;gap:7px;margin-top:8px}
.ev li{border-radius:12px;padding:7px 10px;font-size:.92rem;font-weight:700;background:var(--line);color:var(--muted);border-inline-start:6px solid #cfd6e6}
.ev li.on{background:var(--c,var(--yellow-soft));color:var(--ink);border-inline-start-color:var(--b,#F2C200)}
.ev li.secret{background:var(--pink-soft);border-inline-start-color:var(--pink);color:var(--ink)}
.help ol{padding-inline-start:22px;display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.95rem}
.help .tip{margin-top:8px;background:var(--yellow-soft);border-radius:12px;padding:7px 10px;font-size:.88rem;font-weight:700}
body.nohelp .help{display:none}

/* ---------- المسرح: الصورة + الـ Hotspots ---------- */
.stage-col{display:flex;justify-content:center;min-height:0}
.stage{position:relative;--u:.5px;height:calc(100vh - var(--headH) - 30px);aspect-ratio:1024/1536;max-width:100%;border-radius:18px;overflow:hidden;background:#fff;border:3px solid var(--yellow-soft);box-shadow:0 10px 34px rgba(31,42,68,.18);user-select:none;-webkit-user-select:none}
.stage img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.layer{position:absolute;inset:0}
.layer>*{position:absolute}

/* منطقة سؤال داخل البصمة (شبه شفافة) */
.hs{border:0;border-radius:calc(var(--u)*14);background:rgba(255,222,70,.14);box-shadow:inset 0 0 0 2px rgba(255,160,0,.30);mix-blend-mode:multiply;transition:background .15s,box-shadow .15s,transform .15s;padding:0}
body.nohint .hs:not(.solved):not(.revealed){background:transparent;box-shadow:none}
.hs:hover,.hs:focus-visible{background:rgba(255,222,70,.6);box-shadow:inset 0 0 0 3px #FF9A00;transform:scale(1.025);outline:none}
.hs.tried{background:rgba(255,143,184,.32);box-shadow:inset 0 0 0 3px #FF5C8A}
.hs.solved{background:rgba(76,194,122,.5);box-shadow:inset 0 0 0 3px #26A35A}
.hs.revealed{background:rgba(255,154,60,.45);box-shadow:inset 0 0 0 3px #F57C00}
.hs .mark{position:absolute;inset-inline-start:calc(var(--u)*8);top:50%;transform:translateY(-50%);font-weight:900;font-size:max(14px,calc(var(--u)*30));color:#0E6B33;display:none}
.hs.solved .mark,.hs.revealed .mark{display:block}
.hs.revealed .mark{color:#9A4E00}
.hs.frozen{filter:grayscale(1);opacity:.6}

/* حلقة اكتمال البصمة */
.ring{border-radius:50%;border:calc(var(--u)*7) solid var(--gc);box-shadow:0 0 calc(var(--u)*30) var(--gc),inset 0 0 calc(var(--u)*30) color-mix(in srgb,var(--gc) 45%,transparent);opacity:0;transform:scale(.96);transition:opacity .6s,transform .6s;pointer-events:none}
.ring.on{opacity:.85;transform:scale(1)}
.ring.hl{opacity:.9;transform:scale(1)}

/* شارة المجموعة فوق كل بصمة */
.chip{transform:translateX(-50%);background:var(--gc);color:var(--gi);border:calc(var(--u)*4) solid #fff;border-radius:999px;padding:calc(var(--u)*4) calc(var(--u)*16);font-weight:900;font-size:max(11px,calc(var(--u)*22));white-space:nowrap;box-shadow:0 3px 8px rgba(31,42,68,.3);pointer-events:none;z-index:3}

/* مفاجآت مخفية */
.spot{border:0;border-radius:50%;background:radial-gradient(circle,#fffbd0 0%,#FFD23F 45%,rgba(255,154,60,.35) 70%,transparent 72%);display:grid;place-items:center;font-size:max(16px,calc(var(--u)*30));animation:pulse 1.1s infinite;z-index:4;padding:0}
.spot:hover{filter:brightness(1.15)}
body.debug .spot.unrevealed{outline:2px dashed #8E24AA;opacity:.8;animation:none}

/* القفل + القضية */
.casehs{border:0;border-radius:calc(var(--u)*20);background:transparent;z-index:2;padding:0;transition:box-shadow .2s}
.casehs:hover{box-shadow:0 0 0 calc(var(--u)*5) rgba(255,210,63,.9)}
.casehs.open{box-shadow:0 0 0 calc(var(--u)*6) rgba(76,194,122,.95),0 0 calc(var(--u)*40) rgba(76,194,122,.9);animation:pulseSoft 1.3s infinite}
.casehs.solved{box-shadow:0 0 0 calc(var(--u)*6) rgba(255,210,63,.95)}
.casestat{display:grid;place-items:center;text-align:center;font-weight:900;font-size:max(12px,calc(var(--u)*30));border-radius:calc(var(--u)*16);padding:0 calc(var(--u)*14);pointer-events:none;z-index:3;line-height:1.3}
.casestat.locked{background:rgba(255,255,255,.92);color:#C2185B;border:calc(var(--u)*4) dashed #FF7FAF}
.casestat.open{background:rgba(226,248,234,.96);color:#0E7A3A;border:calc(var(--u)*4) solid #4CC27A;animation:pulseSoft 1.3s infinite}
.casestat.solved{background:rgba(255,243,196,.96);color:#7A5A00;border:calc(var(--u)*4) solid #FFD23F}
.lockbadge{border-radius:50%;background:#fff;border:calc(var(--u)*5) solid #4CC27A;display:grid;place-items:center;font-size:calc(var(--u)*60);z-index:3;box-shadow:0 0 calc(var(--u)*24) #4CC27A;animation:pop .6s;pointer-events:none}
.casehs.shake{animation:shake .5s}

/* وضع المعايرة (اضغط D) */
body.debug .hs{outline:2px solid #1E88E5;background:rgba(30,136,229,.18)}
body.debug .hs::before{content:attr(data-id);position:absolute;top:0;inset-inline-start:0;background:#1E88E5;color:#fff;font:700 10px monospace;padding:0 3px}

/* ---------- النوافذ ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(255,255,255,.78);backdrop-filter:blur(5px);padding:16px;animation:fade .2s}
.modal{position:relative;width:min(900px,96vw);max-height:94vh;overflow:auto;background:#fff;border:5px solid var(--mc,var(--yellow));border-radius:28px;box-shadow:0 20px 60px rgba(31,42,68,.3);padding:22px 24px 22px;animation:popIn .28s}
.modal .x{position:absolute;top:10px;inset-inline-start:12px;width:42px;height:42px;border-radius:50%;border:0;background:var(--line);font-weight:900;font-size:1.2rem;z-index:2}
.modal .x:hover{background:var(--pink-soft)}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px;padding-inline-start:50px}
.qhead span{border-radius:999px;padding:4px 14px;font-weight:900;font-size:.95rem}
.qgroup{background:var(--gc);color:var(--gi)}
.qtype{background:var(--blue-soft);color:#0B5CA8}
.qbonus{background:var(--yellow);color:var(--ink)}
.qpts{background:var(--green-soft);color:#12803C}
.qdbl{background:var(--orange);color:#fff;animation:pulseSoft 1s infinite}
.qtext{font-size:clamp(20px,2.5vw,34px);font-weight:900;line-height:1.5;margin:6px 0 16px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choices.tf{grid-template-columns:1fr 1fr}
.choice{display:flex;align-items:center;gap:12px;text-align:start;background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px 14px;font-weight:800;font-size:clamp(15px,1.7vw,23px);line-height:1.45;box-shadow:0 4px 0 rgba(31,42,68,.07);transition:transform .1s,border-color .15s,background .15s}
.choice:hover:not([disabled]){border-color:var(--blue);background:var(--blue-soft);transform:translateY(-2px)}
.choice .ck{flex:none;width:38px;height:38px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-weight:900}
.choice.right{background:var(--green-soft);border-color:var(--green)} .choice.right .ck{background:var(--green);color:#fff}
.choice.wrong{background:var(--pink-soft);border-color:var(--pink);animation:shake .4s} .choice.wrong .ck{background:var(--pink);color:#fff}
.choice.sel{background:var(--blue-soft);border-color:var(--blue)} .choice.sel .ck{background:var(--blue);color:#fff}
.choice[disabled]{cursor:default}
.tf .choice{justify-content:center;font-size:clamp(20px,2.4vw,32px)}
.qtools{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.hintbox{margin-top:12px;background:var(--yellow-soft);border:3px dashed #F2C200;border-radius:16px;padding:10px 14px;font-weight:800;font-size:clamp(14px,1.5vw,20px)}
.fb{margin-top:12px;border-radius:16px;padding:10px 14px;font-weight:900;font-size:clamp(16px,1.8vw,24px)}
.fb.good{background:var(--green-soft);color:#0E6B33} .fb.bad{background:var(--pink-soft);color:#B0124F} .fb.info{background:var(--blue-soft);color:#0B5CA8}
.explain{margin-top:10px;background:#F6F8FD;border-inline-start:8px solid var(--blue);border-radius:14px;padding:10px 14px;font-weight:700;font-size:clamp(14px,1.5vw,20px);line-height:1.6}
.qfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
/* ربط + ترتيب */
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:12px 36px}
.mitem{position:relative;border:3px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:800;font-size:clamp(14px,1.6vw,21px);background:#fff;text-align:start;box-shadow:0 4px 0 rgba(31,42,68,.07)}
.mitem.sel{border-color:var(--blue);background:var(--blue-soft)}
.mitem .pn{position:absolute;top:-10px;inset-inline-end:-10px;width:26px;height:26px;border-radius:50%;color:#fff;font-size:.8rem;display:grid;place-items:center;font-weight:900}
.mitem[disabled]{cursor:default}
.slots{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.slot{display:flex;align-items:center;gap:10px;border:3px dashed #C9D2E6;border-radius:14px;padding:8px 12px;min-height:50px;font-weight:800;font-size:clamp(14px,1.6vw,21px)}
.slot b{flex:none;width:32px;height:32px;border-radius:50%;background:var(--yellow);display:grid;place-items:center}
.slot.filled{border-style:solid;border-color:var(--green);background:var(--green-soft);cursor:pointer}
.pool{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* مفاجآت / نهاية */
.sbox{text-align:center;padding:10px 6px}
.sbox .big{font-size:clamp(70px,10vw,120px);line-height:1;animation:bounce 1s infinite}
.sbox h2{font-size:clamp(24px,3vw,40px);margin:8px 0}
.sbox p{font-size:clamp(16px,1.9vw,24px);font-weight:700;line-height:1.7;margin-bottom:14px}
.evgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.evgrid div{background:var(--yellow-soft);border-inline-start:6px solid var(--yellow);border-radius:12px;padding:6px 10px;font-weight:700;font-size:.92rem}
.evgrid div.sec{background:var(--pink-soft);border-color:var(--pink)}
.rank{display:flex;flex-direction:column;gap:8px;margin:14px 0;text-align:start}
.rank .row{display:grid;grid-template-columns:40px 150px 1fr 60px;gap:8px;align-items:center;font-weight:900}
.rank .trk{height:22px;background:var(--line);border-radius:12px;overflow:hidden}
.rank .trk i{display:block;height:100%;background:var(--gc);border-radius:12px;width:0;transition:width 1.2s .2s}
.rank .row.win .nm::after{content:" 👑"}
.sel-row{display:flex;gap:10px;align-items:center;margin-top:12px;font-weight:800;flex-wrap:wrap}
.sel-row select{border:3px solid var(--line);border-radius:12px;padding:6px 10px;font-weight:800;background:#fff}

/* إشعارات */
#toasts{position:fixed;top:calc(var(--headH) + 14px);left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,620px)}
.toast{background:var(--ink);color:#fff;border-radius:16px;padding:10px 18px;font-weight:800;font-size:clamp(14px,1.5vw,19px);box-shadow:0 8px 24px rgba(0,0,0,.25);animation:toastIn .3s,toastOut .4s 3.6s forwards;text-align:center}
.toast.big{background:var(--green);font-size:clamp(16px,1.9vw,24px)}
.toast.warn{background:var(--pink)}

/* قصاصات احتفال */
.cf{position:fixed;top:-20px;width:12px;height:18px;z-index:90;pointer-events:none;animation:fall linear forwards}

@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes pulseSoft{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes floatUp{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-44px)}}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}

/* شاشات أصغر: ترتيب عمودي */
@media (max-width:980px){
  body{overflow:auto}
  .main{display:flex;flex-direction:column;height:auto;padding-bottom:30px}
  .stage-col{order:-1}
  .stage{height:auto;width:min(100%,640px)}
  .panel{overflow:visible}
  .brand .sub,.btn .lbl{display:none}
  .choices,.mcols,.pool,.evgrid{grid-template-columns:1fr}
  .rank .row{grid-template-columns:34px 100px 1fr 50px}
}
</style>
</head>

<body>
<div id="toasts" aria-live="polite"></div>

<!-- ============ الشريط العلوي ============ -->
<header class="top">
  <div class="brand">
    <span class="logo">🔍</span>
    <h1>لغز <b>البصمات</b></h1>
    <span class="sub" id="subTitle"></span>
  </div>
  <div class="tools">
    <button class="btn blue" id="btnHelp" title="إظهار / إخفاء التعليمات">📖<span class="lbl">التعليمات</span></button>
    <button class="btn green" id="btnSound" title="تشغيل / إيقاف الصوت">🔊<span class="lbl">الصوت</span></button>
    <button class="btn orange" id="btnFs" title="ملء الشاشة">⛶<span class="lbl">ملء الشاشة</span></button>
    <button class="btn pink" id="btnReset" title="إعادة اللعبة من البداية">🔄<span class="lbl">إعادة</span></button>
  </div>
</header>

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v === false || v == null) continue;
    if (k === "class") e.className = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach(c => { if (c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(c)); });
  return e;
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

const Sound = {
  on: SETTINGS.soundOn, ctx: null,
  init() {
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === "suspended") this.ctx.resume();
    } catch (e) { /* لا صوت */ }
  },
  tone(f, d = .15, type = "sine", delay = 0, vol = .16) {
    if (!this.on || !this.ctx) return;
    const c = this.ctx, o = c.createOscillator(), g = c.createGain(), t0 = c.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .015); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + d + .05);
  },
  play(n) {
    this.init();
    const S = {
      click:   () => this.tone(620, .07, "triangle"),
      correct: () => [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .18, "triangle", i * .09)),
      wrong:   () => { this.tone(220, .22, "sawtooth", 0, .1); this.tone(160, .3, "sawtooth", .12, .1); },

      unlock:  () => [392, 494, 587, 784, 988, 1175].forEach((f, i) => this.tone(f, .24, "triangle", i * .12)),
      win:     () => [523, 523, 523, 659, 784, 659, 784, 1047].forEach((f, i) => this.tone(f, .26, "triangle", i * .13))
    };
    (S[n] || S.click)();
  }
};

const STORE_KEY = "fingerprintPuzzle.industrial.v1", NAMES_KEY = "fingerprintPuzzle.industrial.names.v1";
function freshState() {
  return {
    score: GROUPS.map(() => 0), dbl: GROUPS.map(() => false), hints: GROUPS.map(() => 0), frozen: GROUPS.map(() => 0),
    q: {}, spots: {}, seen: {}, fpDone: {}, secrets: [],
    caseState: "locked", finalAttempts: 0
  };
}
let state = freshState();
let names = GROUPS.map(g => g.name);
let debug = false;

function save() {
  if (!SETTINGS.persist) return;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); localStorage.setItem(NAMES_KEY, JSON.stringify(names)); } catch (e) {}
}
function load() {
  if (!SETTINGS.persist) return;
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (s && Array.isArray(s.score) && s.score.length === GROUPS.length) state = Object.assign(freshState(), s);
    const n = JSON.parse(localStorage.getItem(NAMES_KEY) || "null");
    if (Array.isArray(n) && n.length === GROUPS.length) names = n.map((v, i) => v || GROUPS[i].name);
  } catch (e) {}
}

const qState = id => state.q[id] || (state.q[id] = { status: "open", attempts: 0, hint: false, earned: 0 });
const isDone = id => !!state.q[id] && state.q[id].status !== "open";
const groupDone = g => GROUPS[g].questions.filter(q => isDone(q.id)).length;
const groupComplete = g => groupDone(g) === GROUPS[g].questions.length;
const totalDone = () => GROUPS.reduce((s, _, g) => s + groupDone(g), 0);
const totalQ = () => GROUPS.reduce((s, G) => s + G.questions.length, 0);
const completeCount = () => GROUPS.filter((_, g) => groupComplete(g)).length;
const isFrozen = g => state.frozen[g] > Date.now();

function addScore(g, d) {
  const before = state.score[g];
  state.score[g] = Math.max(0, before + d);
  const real = state.score[g] - before;
  if (real !== 0) floatText(g, real);
}

function confetti(n = 110) {

let modalClosable = true, modalOnClose = null;

/* ═══════════════════ السؤال ═══════════════════ */

}

function openEnding() {
  const rank = GROUPS.map((G, g) => ({ g, G, s: state.score[g] })).sort((a, b) => b.s - a.s);
  const top = rank[0].s, winners = rank.filter(r => r.s === top);
  const wname = winners.map(r => names[r.g]).join(" و ");
  const msg = SETTINGS.endMessages[Math.random() * SETTINGS.endMessages.length | 0];
  const rows = rank.map((r, k) => {
    const trk = h("i", { style: `--gc:${r.G.color}` });
    setTimeout(() => { trk.style.width = (top ? r.s / top * 100 : 0) + "%"; trk.style.background = r.G.color; }, 60);
    return h("div", { class: "row" + (r.s === top ? " win" : "") }, h("span", null, ["🥇", "🥈", "🥉", "4", "5"][k]), h("span", { class: "nm" }, names[r.g]), h("div", { class: "trk" }, trk), h("span", null, r.s));
  });
  Sound.play("win"); confetti(160);
  openModal(h("div", { class: "sbox" },
    h("div", { class: "big" }, "🏆"),
    h("h2", { style: "color:#E08A00" }, winners.length > 1 ? "تعادل بين: " + wname : "الفريق الفائز: " + wname),
    h("p", { style: "margin-bottom:4px" }, `أُنجز ${totalDone()} من ${totalQ()} سؤالًا، واكتملت ${completeCount()} بصمات.`),
    h("div", { class: "rank" }, rows),
    h("p", null, msg),
    h("div", { class: "qfoot", style: "justify-content:center" },
      h("button", { class: "btn blue", onclick: () => { Sound.play("click"); closeModal(); } }, "إغلاق"),
      h("button", { class: "btn pink", onclick: () => { Sound.play("click"); confirmReset(); } }, "🔄 لعبة جديدة"))), { color: "#FFD23F" });
}

/* ═══════════════════ الأزرار العلوية ═══════════════════ */
function refresh() { renderStage(); updateScoreboard(); updateStatus(); }
function confirmReset() {
  Sound.init();
  openModal(h("div", { class: "sbox" }, h("div", { class: "big" }, "🔄"), h("h2", null, "إعادة اللعبة من البداية؟"),
    h("p", null, "سيتم تصفير النقاط والتقدم والمفاجآت وإقفال القضية من جديد."),
    h("div", { class: "qfoot", style: "justify-content:center" },
      h("button", { class: "btn pink", onclick: () => { doReset(); } }, "نعم، أعد اللعبة"),
      h("button", { class: "btn ghost", onclick: () => closeModal() }, "إلغاء"))), { color: "#FF7FAF" });
}
function doReset() {
  $("#overlay").hidden = true; $("#modalBody").innerHTML = ""; modalOnClose = null;
  state = freshState();
  if (!SETTINGS.resetKeepsNames) names = GROUPS.map(g => g.name);
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  save(); refresh(); Sound.play("click"); toast("تمت إعادة اللعبة. بالتوفيق للجميع! 🍀");
}
$("#btnReset").addEventListener("click", confirmReset);
$("#btnHelp").addEventListener("click", () => { Sound.play("click"); document.body.classList.toggle("nohelp"); });
$("#btnSound").addEventListener("click", () => {
  Sound.on = !Sound.on; Sound.init(); if (Sound.on) Sound.play("click");
  $("#btnSound").firstChild.textContent = Sound.on ? "🔊" : "🔇";
  try { localStorage.setItem("fingerprintPuzzle.industrial.sound", Sound.on ? "1" : "0"); } catch (e) {}
});
function toggleFs() {
  const d = document, de = d.documentElement;
  try {
    if (!(d.fullscreenElement || d.webkitFullscreenElement)) (de.requestFullscreen || de.webkitRequestFullscreen).call(de);
    else (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  } catch (e) { toast("المتصفح لا يسمح بملء الشاشة هنا", "warn"); }
}
$("#btnFs").addEventListener("click", toggleFs);
["fullscreenchange", "webkitfullscreenchange"].forEach(ev => document.addEventListener(ev, () => {
  $("#btnFs").firstChild.textContent = (document.fullscreenElement || document.webkitFullscreenElement) ? "🗗" : "⛶";
  setTimeout(fitStage, 100);
}));

/* مؤقت التجميد */
setInterval(() => {
  let any = false;
  state.frozen.forEach((t, i) => { if (t) { any = true; if (t <= Date.now()) { state.frozen[i] = 0; toast("☀️ ذاب الجليد! " + names[i] + " تعود للعمل"); renderStage(); } } });
  if (any) { updateScoreboard(); updateChips(); }
}, 500);

/* ═══════════════════ التشغيل ═══════════════════ */
(function init() {
  if (IMAGE.src) $("#boardImg").src = IMAGE.src;
  stage.style.aspectRatio = W + " / " + H;
  load();
  try { const s = localStorage.getItem("fingerprintPuzzle.industrial.sound"); if (s !== null) Sound.on = s === "1"; } catch (e) {}
  $("#btnSound").firstChild.textContent = Sound.on ? "🔊" : "🔇";
  if (!SETTINGS.showHelpAtStart) document.body.classList.add("nohelp");
  if (!SETTINGS.showHotspotHints) document.body.classList.add("nohint");
  buildHelp(); buildScoreboard(); refresh(); fitStage();
})();
</script>
</body>
</html>
